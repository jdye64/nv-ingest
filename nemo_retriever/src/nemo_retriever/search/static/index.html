<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeMo Retriever Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --nv-green: #76b900;
      --nv-green-dark: #5a8a00;
      --nv-green-light: #8fd400;
      --nv-bg: #0e0e0e;
      --nv-card: #1a1a1a;
      --nv-border: #262626;
      --nv-text: #e0e0e0;
      --nv-text-muted: #888;
      --nv-text-dim: #555;
      --nv-row-even: #161616;
      --nv-row-odd: #1c1c1c;
      --nv-row-hover: #242424;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--nv-bg);
      color: var(--nv-text);
      min-height: 100vh;
    }
    .mono { font-family: 'JetBrains Mono', 'Consolas', monospace; }
    .search-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .search-hero {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px 32px;
      transition: padding 0.2s ease;
    }
    .search-hero.compact { padding-top: 32px; padding-bottom: 16px; }
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand h1 {
      font-size: 28px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .brand p {
      margin-top: 8px;
      font-size: 13px;
      color: var(--nv-text-muted);
    }
    .search-bar-wrap {
      width: 100%;
      max-width: 720px;
      display: flex;
      align-items: stretch;
      gap: 0;
      background: var(--nv-card);
      border: 1px solid var(--nv-border);
      border-radius: 999px;
      padding: 6px 6px 6px 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }
    .search-bar-wrap:focus-within {
      border-color: var(--nv-green);
      box-shadow: 0 0 0 1px rgba(118,185,0,0.3), 0 8px 32px rgba(0,0,0,0.35);
    }
    .upload-menu { position: relative; }
    .upload-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      min-width: 180px;
      background: var(--nv-card);
      border: 1px solid var(--nv-border);
      border-radius: 12px;
      padding: 6px;
      z-index: 20;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
    }
    .upload-dropdown button {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--nv-text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }
    .upload-dropdown button:hover { background: rgba(255,255,255,0.06); }
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--nv-text);
      font-size: 16px;
      padding: 12px 16px;
      outline: none;
      font-family: inherit;
    }
    .search-input::placeholder { color: var(--nv-text-dim); }
    .status-line {
      margin-top: 16px;
      font-size: 12px;
      color: var(--nv-text-dim);
      text-align: center;
    }
    .results-area {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 48px;
    }
    .runs-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
    .runs-table thead th {
      padding: 10px 16px; text-align: left; font-weight: 600; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.05em; color: var(--nv-text-muted);
      border-bottom: 1px solid var(--nv-border); background: var(--nv-card);
      position: sticky; top: 0; z-index: 1;
    }
    .runs-table tbody tr:nth-child(even) { background: var(--nv-row-even); }
    .runs-table tbody tr:nth-child(odd) { background: var(--nv-row-odd); }
    .runs-table tbody tr:hover { background: var(--nv-row-hover); }
    .runs-table td { padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 999px; font-size: 13px;
      font-weight: 600; cursor: pointer; border: none;
      transition: all 0.15s ease; font-family: inherit;
    }
    .btn-primary { background: var(--nv-green); color: #000; }
    .btn-primary:hover { background: var(--nv-green-light); }
    .btn-primary:disabled { background: #333; color: #666; cursor: not-allowed; }
    .btn-secondary { background: rgba(255,255,255,0.06); color: var(--nv-text); border: 1px solid var(--nv-border); }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); }
    .btn-icon { padding: 10px; border-radius: 999px; background: transparent; color: var(--nv-text-muted); }
    .btn-icon:hover { background: rgba(255,255,255,0.06); color: var(--nv-green); }
    .btn-sm { padding: 5px 10px; font-size: 11px; border-radius: 6px; }
    .card { background: var(--nv-card); border: 1px solid var(--nv-border); border-radius: 12px; overflow: hidden; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 100px; font-size: 11px;
      font-weight: 600; text-transform: uppercase;
    }
    .badge-pass { background: rgba(118,185,0,0.12); color: #76b900; }
    .badge-fail { background: rgba(255,80,80,0.12); color: #ff5050; }
    .spinner {
      border: 2px solid #333; border-top-color: var(--nv-green); border-radius: 50%;
      width: 16px; height: 16px; animation: spin 0.7s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; padding: 32px;
    }
    .modal-content {
      background: var(--nv-card); border: 1px solid var(--nv-border);
      border-radius: 16px; width: 100%; max-width: 480px;
      box-shadow: 0 24px 48px rgba(0,0,0,0.5);
    }
    .modal-head {
      padding: 20px 24px; border-bottom: 1px solid var(--nv-border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-body { padding: 24px; }
    .error-banner {
      margin: 0 auto 16px; max-width: 720px; padding: 12px 16px;
      border-radius: 8px; background: rgba(255,50,50,0.08);
      border: 1px solid rgba(255,50,50,0.2); color: #ff5050; font-size: 13px;
    }
    .footer {
      padding: 12px 24px; font-size: 11px; color: var(--nv-text-dim);
      text-align: center; border-top: 1px solid var(--nv-border);
    }
    .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .top-bar {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 16px;
      z-index: 40;
      pointer-events: none;
    }
    .top-bar > * { pointer-events: auto; }
    .hamburger-btn {
      background: rgba(26,26,26,0.85);
      border: 1px solid var(--nv-border);
      backdrop-filter: blur(8px);
    }
    .input {
      background: var(--nv-bg);
      border: 1px solid var(--nv-border);
      color: var(--nv-text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }
    .input:focus { border-color: var(--nv-green); box-shadow: 0 0 0 1px rgba(118,185,0,0.3); }
    .input:disabled { opacity: 0.45; cursor: not-allowed; }
    .settings-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
    }
    .settings-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(400px, 100vw);
      height: 100vh;
      z-index: 100;
      background: var(--nv-card);
      border-left: 1px solid var(--nv-border);
      display: flex;
      flex-direction: column;
      box-shadow: -12px 0 40px rgba(0,0,0,0.45);
      animation: slideIn 0.2s ease;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .settings-drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--nv-border);
    }
    .settings-drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .settings-drawer-foot {
      padding: 16px 20px;
      border-top: 1px solid var(--nv-border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .settings-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--nv-text-muted);
      margin: 8px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--nv-border);
    }
    .settings-hint {
      margin-top: 6px;
      font-size: 11px;
      color: var(--nv-text-dim);
      line-height: 1.5;
    }
    .settings-error {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255,50,50,0.08);
      border: 1px solid rgba(255,50,50,0.2);
      color: #ff5050;
      font-size: 12px;
    }
  </style>
</head>
<body>
<div id="root"></div>
<div id="boot-error" style="display:none;padding:24px;color:#ff5050;font-family:monospace;white-space:pre-wrap;"></div>
<script>
(async function loadViews() {
  const bootError = document.getElementById("boot-error");
  function fail(msg) {
    console.error(msg);
    bootError.style.display = "block";
    bootError.textContent = msg;
  }
  if (typeof React === "undefined" || typeof ReactDOM === "undefined" || typeof Babel === "undefined") {
    fail("Failed to load React or Babel from CDN. Check network access to cdn.jsdelivr.net.");
    return;
  }
  const cacheBust = "v=" + Date.now();
  const files = [
    "/static/views/icons.jsx",
    "/static/views/upload.jsx",
    "/static/views/results.jsx",
    "/static/views/settings.jsx",
    "/static/views/search.jsx",
    "/static/views/app.jsx",
  ];
  let bundle = '"use strict";\n';
  for (const file of files) {
    try {
      const res = await fetch(file + "?" + cacheBust);
      if (!res.ok) {
        fail("Failed to load " + file + " (HTTP " + res.status + ")");
        return;
      }
      const jsx = await res.text();
      bundle += Babel.transform(jsx, { presets: ["react"] }).code + "\n";
    } catch (err) {
      fail("Failed to load/transform " + file + ": " + err);
      return;
    }
  }
  try {
    const el = document.createElement("script");
    el.textContent = bundle;
    document.head.appendChild(el);
  } catch (err) {
    fail("Failed to boot UI: " + err);
  }
})();
</script>
</body>
</html>
