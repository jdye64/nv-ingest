[workspace]
resolver = "2"
members = [
    "crates/nrr-core",
    "crates/nrr-nim",
    "crates/nrr-vdb",
    "crates/nrr-pipeline",
    "crates/nrr-service",
    "crates/nrr-cli",
    "crates/nrr-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["NVIDIA NeMo Retriever Team"]
repository = "https://github.com/NVIDIA/NeMo-Retriever"

[workspace.dependencies]
# Async runtime + utilities
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"

# Web framework
axum = { version = "0.7", features = ["multipart", "macros", "ws"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "util", "limit", "fs"] }
hyper = { version = "1.5", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls", "http2", "gzip"] }

# Serde / JSON / YAML
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_with = "3"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"

# Metrics (Prometheus)
prometheus = { version = "0.13", default-features = false }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Misc
uuid = { version = "1", features = ["v4", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
bytes = "1"
once_cell = "1"
parking_lot = "0.12"
arc-swap = "1"
dashmap = "6"
url = "2"

# PDF (page-count + light extraction)
lopdf = "0.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
